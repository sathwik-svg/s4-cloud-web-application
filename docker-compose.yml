services:
  web:
    build: .
    container_name: s4-cloud-web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudapp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: s4-cloud-postgres
    environment:
      POSTGRES_DB: cloudapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
